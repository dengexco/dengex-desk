# Phase-0 local dependencies, NOT a production deployment. No remote-support API
# or admin panel is ready yet. TURN and Keycloak are opt-in experiment profiles.
name: dengex-remote-lab
services:
  api:
    build:
      context: ../services/api
    environment:
      DX_LISTEN: 0.0.0.0:8080
    ports: ['127.0.0.1:8080:8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ['CMD', '/api', '--healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dengex
      POSTGRES_USER: dengex_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ['postgres-data:/var/lib/postgresql/data']
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dengex_migrator -d dengex']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    volumes: ['redis-data:/data']
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
  keycloak:
    profiles: [identity]
    image: quay.io/keycloak/keycloak:26.7.3
    command: ['start-dev']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: '${KC_BOOTSTRAP_ADMIN_USERNAME:-lab-admin}'
      KC_BOOTSTRAP_ADMIN_PASSWORD: '${KC_BOOTSTRAP_ADMIN_PASSWORD:-}'
      KC_HEALTH_ENABLED: 'true'
    ports: ['127.0.0.1:8180:8080']
    volumes: ['keycloak-data:/opt/keycloak/data']
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1
  coturn:
    profiles: [relay]
    image: coturn/coturn:4.15.0
    command: ['-c', '/etc/coturn/turnserver.conf']
    volumes: ['./secrets/turnserver.conf:/etc/coturn/turnserver.conf:ro']
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
volumes:
  postgres-data:
  redis-data:
  keycloak-data:
secrets:
  postgres_password:
    file: ./secrets/postgres_password
