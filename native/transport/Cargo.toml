[package]
license.workspace = true
name = "dengex-transport"
version.workspace = true
edition.workspace = true
publish.workspace = true
[[bin]]
name = "dx-probe"
path = "src/main.rs"
[dependencies]
dengex-agent-core = { path = "../agent-core" }
webrtc = "=0.20.5"
