name: Build and publish desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match the app version)
        required: true
        default: v0.2.0-beta.1
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/test-windows-launcher.py
      - run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: .artifacts/releases/dengeX-Remote-Windows-x64.zip
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: .artifacts/releases/dengeX-Remote-macOS-*.zip
          if-no-files-found: error
  publish:
    needs: [verify, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate release tag and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json,os,re
          version=json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version']
          assert re.fullmatch('v'+re.escape(version)+r'-beta\.[1-9][0-9]*',os.environ['RELEASE_TAG']), 'Invalid or mismatched beta tag'
          PY
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish tested beta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --prerelease --title "dengeX Remote $RELEASE_TAG" --notes-file docs/releases/v0.2.0-beta.1.md
