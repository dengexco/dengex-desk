[workspace]
resolver = "2"
members = ["native/agent-core", "native/transport", "native/platform-windows", "apps/desktop/src-tauri"]
default-members = ["native/agent-core", "native/transport", "native/platform-windows"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
